# Central axial scan: one fixed-cycle sweep per depth, 10..500 µm.
# mode = "fixed": `cycles` sets the number of in-out cycles; max_time_s = 15 is
# only a wall-clock cap.

[defaults]
mode = "fixed"
cycles = 4
max_time_s = 15
replicates = 1
R_mm = 0.0
phi_deg = 0.0
delta_c_mm = 1.0
motion_limit_um = 60

