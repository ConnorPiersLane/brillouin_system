[calibration]
n_per_freq = 1
degree = 2
# Polynomial degree of the OUTER-order frequency tracks (outer_left,
# outer_right, outer distance). 2026-09-10: the outer tracks bend more than a
# parabola (their degree-2 fits miss their own calibration points by 2-3 MHz
# in the water band, the inner ones by <0.5); a cubic follows them and
# halves the outer-vs-inner split. The inner tracks keep `degree`.
outer_degree = 3
start = 4.0
stop = 8.0
step = 0.1
# "weighted" since 2026-09-10 (user decision): the reported shift is the
# photon-weighted average of the inner and the outer pair distance (each
# pair weighted by its photon number, ~0.7 / 0.3). Falls back to the inner
# distance on frames without the outer pair (two-peak fits/calibrations).
reference = "weighted"
# NOTE: the save_calibration_frames toggle was REMOVED 2026-08-24 — raw
# calibration frames ALWAYS travel with each scan (re-analysis + the
# reflection-background frequency anchor both depend on them).
