# Measured instrument constants.
#
# Every number here was FITTED from dedicated measurements, not taken from a
# spec sheet. Dates and methods in the comments; re-measure after any change
# of camera, readout mode or ROI.

[camera]
# Photoelectrons per digitised count. Andor DU897, Conventional amplifier,
# 0.08 MHz readout, preamp 1x — the sensitivity is a property of that mode,
# not of the camera. Quadratic photon transfer (var = S/g + (eps*S)^2 + c)
# over 126 scans x 50 frames, 2026-08-12; a LINEAR photon-transfer fit is
# biased low by the common-mode source noise (it returned 3.5 on the same
# data). +- 0.04, hardware-stable across sessions.
gain_e_per_count = 3.89

# Per-pixel read noise rms in counts (4.3 e-), from a dark exposure ladder
# 2026-08-19. No measurable dark current at operating settings.
read_noise_counts = 1.10

[pixel_response]
# Frozen camera pixel-response kernel of the 'pixel_response' lineshape:
# Gaussian charge-diffusion blur (sigma) and a one-sided exponential readout
# smear per peak, toward higher pixel numbers (the charge-transfer
# direction). Measured 2026-07 on fine EOM sweeps; stable across 6
# calibrations over 7 weeks. One camera, one kernel — the same constants
# apply to calibration and sample fits.
sigma_px = 0.25
tau_left_px = 0.4
tau_right_px = 0.2

# Outer-order tails for the 4-peak fit. PROVISIONAL — measured 2026-08-20
# from outer calibration lines; tau falls ~linearly toward the readout side
# (+0.50 / +0.40 / +0.20 / +0.00 across the four peak positions).
tau_outer_left_px = 0.5
tau_outer_right_px = 0.0
